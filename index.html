<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="purple">
            <h1 id="metric-el">Metric/Imperial Unit Conversion</h1>
            <h1 id="num-el">20</h1>
            <button id="convert-btn">Convert</button>
        </div>
        <div id="gray">
            <div class="measurement">
                <h1 class="label">Length (Meter/Feet)</h1>
                <p>20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
            </div>
            <div class="measurement">
                <h1 class="label">Volume (Liters/Gallon)</h1>
                <p>20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
            </div>
            <div class="measurement">
                <h1 class="label">Mass (Kilograms/Pounds)</h1>
                <p>20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
