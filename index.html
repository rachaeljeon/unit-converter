<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="purple">
            <h1 id="metric-el">Metric/Imperial Unit Conversion</h1>
            <input type="text" id="number-el">
            <button id="convert-btn">Convert</button>
        </div>
        <div id="gray">
            <div class="measurement">
                <h1 class="label">Length (Meter/Feet)</h1>
                <p id="length-el">meters = feet | feet = meters</p>
            </div>
            <div class="measurement">
                <h1 class="label">Volume (Liters/Gallon)</h1>
                <p id="volume-el">liters = gallons | gallons = liters</p>
            </div>
            <div class="measurement">
                <h1 class="label">Mass (Kilograms/Pounds)</h1>
                <p id="mass-el">kilos = pounds | pounds =  kilos</p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
